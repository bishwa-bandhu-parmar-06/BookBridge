<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<title>{{ document_title }}</title>
<style>
{% for f in fonts %}
@font-face { font-family: "{{ f.family }}"; src: url("{{ f.url }}"); font-weight: {{ f.weight }}; font-style: {{ f.style }}; }
{% endfor %}

@page {
  size: A4;
  margin: 18mm 17mm 18mm 17mm;
  @top-right { content: string(running-title); font-size: {{ pt(8.5) }}; color: #666; }
  @bottom-center { content: counter(page); font-size: {{ pt(9) }}; color: #444; }
}
@page cover { @top-right { content: none; } @bottom-center { content: none; } }

html { font-family: {{ font_stack }}; font-size: {{ pt(11) }}; line-height: 1.5; color: #111; }
body { margin: 0; }

h1, h2, h3, h4, h5 { line-height: 1.3; page-break-after: avoid; break-after: avoid; font-weight: 700; }

/* Chapter title: like the book's banner */
h1.chapter-title {
  font-size: {{ pt(19) }}; text-align: center; margin: 0 0 2mm 0; padding: 2.5mm 4mm;
  border-top: 2pt solid #222; border-bottom: 2pt solid #222; background: #efefef;
  string-set: running-title content();
}
.part-title { text-align: center; font-size: {{ pt(24) }}; font-weight: 700; margin: 2mm 0 5mm; page-break-after: avoid; break-after: avoid; }
h1.chapter-title { margin-bottom: 5mm; }

/* Level 1 inside a chapter (e.g. part titles) */
h2.lvl1 { font-size: {{ pt(15) }}; text-align: center; margin: 6mm 0 3mm; }
/* Level 2: the book's grey section bar */
h3.lvl2 { font-size: {{ pt(12.5) }}; text-align: center; background: #d9d9d9; padding: 1.3mm 3mm; margin: 5mm 0 2.5mm; }
/* Level 3: "❑ Sub-heading" */
h4.lvl3 { font-size: {{ pt(11.5) }}; margin: 4mm 0 1.5mm; }
h4.lvl3::before { content: "❑ "; font-family: "Noto Sans Math", "Noto Sans", sans-serif; font-weight: 400; }
h4.lvl3.in-box, h3.in-box, h2.in-box { text-align: center; background: none; margin: 1mm 0 2mm; padding: 0; font-size: {{ pt(11.5) }}; }
h4.lvl3.in-box::before { content: none; }

p { margin: 0 0 1.8mm 0; orphans: 2; widows: 2; }
p.li { padding-left: 4mm; text-indent: -4mm; }
p.small { font-size: {{ pt(10) }}; }
p.small.in-box { text-align: center; }  /* diagram labels */

/* Question – answer: answer bold and right-aligned, on the same line when it fits */
.qa { display: flex; flex-wrap: wrap; align-items: baseline; margin: 0 0 1.8mm 0; break-inside: avoid; page-break-inside: avoid; }
.qa .q { flex: 0 1 auto; }
.qa.li .q { padding-left: 4mm; text-indent: -4mm; }
.qa .a { margin-left: auto; padding-left: 3mm; font-weight: 700; text-align: right; }

/* Tables: ruled like the book */
table.book { border-collapse: collapse; margin: 2mm 0 4mm; font-size: {{ pt(10.5) }}; break-inside: avoid; page-break-inside: avoid; }
table.book th, table.book td { border: 0.8pt solid #333; padding: 1mm 2.5mm; text-align: left; vertical-align: top; }
table.book th { font-weight: 700; background: #f0f0f0; }
table.book tr.title th { text-align: center; background: #e2e2e2; }

/* Framed notes ("Special facts") and diagram labels */
.box { border: 0.9pt solid #333; padding: 2.5mm 4mm 1mm; margin: 3mm 0 4mm; break-inside: avoid; page-break-inside: avoid; }
.box .qa, .box p.li { margin-bottom: 1.2mm; }

.untranslated { color: #8a5a00; background: #fff6e0; }

/* Student annotations */
mark { padding: 0 0.5pt; border-radius: 1.5pt; color: inherit; }
mark.hl-yellow { background: #fff27a; }
mark.hl-green { background: #b8f3c6; }
mark.hl-pink { background: #ffc2d8; }
mark.hl-blue { background: #bfe3ff; }
.star { color: #d97706; font-weight: 700; }
.note { margin: -0.5mm 0 2.2mm 4mm; padding: 1mm 2.5mm; border-left: 1.8pt solid #f59e0b; background: #fff8e6; font-size: {{ pt(9.5) }}; color: #5b4300; break-inside: avoid; page-break-inside: avoid; }
.note b { color: #b45309; }
.formula {
  font-family: "Noto Sans Mono", "Noto Sans Math", {{ font_stack }};
  text-align: center; margin: 3mm auto 4mm; padding: 2mm 4mm; background: #f5f7fa;
  white-space: pre-wrap; page-break-inside: avoid; break-inside: avoid;
}
figure { margin: 4mm 0; text-align: center; page-break-inside: avoid; break-inside: avoid; }
figure img { max-width: 100%; max-height: 190mm; height: auto; }

.chapter + .chapter { page-break-before: always; break-before: page; }

/* cover + contents (book only) */
.cover { page: cover; text-align: center; padding-top: 70mm; page-break-after: always; break-after: page; }
.cover h1 { font-size: {{ pt(26) }}; color: #1d3f5e; margin-bottom: 8mm; }
.cover .meta { color: #666; font-size: {{ pt(11) }}; }
.toc { page-break-after: always; break-after: page; }
.toc h1 { font-size: {{ pt(20) }}; color: #1d3f5e; margin-bottom: 6mm; }
.toc ol { list-style: none; padding: 0; margin: 0; }
.toc li { margin: 0 0 2.5mm 0; }
.toc a { color: inherit; text-decoration: none; }
.toc a::after { content: leader(".") target-counter(attr(href), page); }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
