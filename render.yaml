# Render Blueprint for the BookBridge API (free plan). Render → New → Blueprint → pick this repo.
# The website (frontend/) goes on Vercel; see DEPLOY.md.
services:
  - type: web
    name: bookbridge-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false # you type it in Render's dashboard; never commit it
      - key: FRONTEND_ORIGIN
        sync: false # your Vercel address, e.g. https://bookbridge.vercel.app
      - key: TRANSLATOR
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-3-flash-preview,gemini-3.8-flash
      - key: GEMINI_THINKING_LEVEL
        value: minimal
      # The free plan has 512 MB of memory: keep books smaller than on your PC.
      - key: MAX_UPLOAD_MB
        value: "40"
      - key: MAX_PAGES
        value: "400"
